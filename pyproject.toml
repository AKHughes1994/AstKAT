[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astkat"
version = "0.1.0"
description = "Joint astrometric calibration of multi-epoch radio images"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Andrew Hughes", email = "hughesakh@gmail.com" }]
# Lower bounds are the versions AstKAT is developed and tested with
dependencies = [
    "numpy>=2.2",
    "scipy>=1.14",
    "astropy>=6.1",
    "matplotlib>=3.10",
    "pyyaml>=6.0",
    "bottleneck>=1.5",
    "psutil>=7.0",
    "pymc>=6.3",
    "pytensor>=3.3",
    "arviz>=1.3",
    "nutpie>=0.16",
    "h5netcdf>=1.6",        # writes the MCMC trace (results/fit_trace.nc)
    "corner>=2.2",
    "photutils>=2.0",
    "pypher>=0.7",
]

[project.optional-dependencies]
# PyBDSF compiles Fortran/C extensions; it needs gfortran and boost to install (see README)
extraction = ["bdsf>=1.14"]

[project.scripts]
astkat = "astkat.cli:main"

[tool.setuptools.packages.find]
include = ["astkat*"]
